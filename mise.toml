[settings]
# Rust comes from rust-toolchain.toml, which rustup reads too (dist's CI).
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-deny = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-insta = "1.48.0"
"aqua:axodotdev/cargo-dist" = "0.33.0"
# VCS tests create real jj repos.
jj = "0.45.1"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy with warnings as errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "Check advisories, licenses, bans and sources"
run = "cargo deny --locked check"

[tasks.dist]
description = "Check release.yml is what dist generates"
# The ceiling keeps dist in this checkout: from a jj workspace, git would
# find the main checkout instead.
run = """
GIT_CEILING_DIRECTORIES="$(dirname "$PWD")" dist generate --check \
  || { echo "release.yml is stale: run dist generate (see CLAUDE.md)" >&2; exit 1; }
"""

[tasks.test]
description = "Run unit, integration and doc tests"
run = [
  "cargo nextest run --workspace --locked",
  "cargo test --workspace --doc --locked",
]

[tasks.coverage]
description = "Report test coverage (informational, not part of check)"
run = "cargo llvm-cov nextest --workspace --locked"

# Regenerates the README's screenshots in docs/images/ from the demo example
# and the config editor's screenshot test; see scripts/screenshots.mjs.
[tasks.screenshots]
description = "Screenshot the demo dashboard and the config editor for the README (needs Chrome)"
tools = { node = "26.10.0" }
run = "node scripts/screenshots.mjs"

# Bumps the version, tags the release on main, and pushes only with --push;
# see scripts/release.sh.
[tasks.release]
description = "Cut a release: mise run release [X.Y.Z] [--push]"
run = "scripts/release.sh"

# Rebuilds crates/web/assets/twemoji.woff2 from Mozilla's Twemoji COLR font,
# pinned by release and sha256, subset to crates/web/assets/emoji.txt.
[tasks.emoji-font]
description = "Rebuild the dashboard's emoji font from the pinned Twemoji release"
tools = { uv = "0.12.19" }
run = """
set -eu
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
curl -fsSL -o "$tmp/Twemoji.Mozilla.ttf" \
  https://github.com/mozilla/twemoji-colr/releases/download/v0.7.0/Twemoji.Mozilla.ttf
echo "6d90152ee0d29e82fe2a87793af5aa4b7ad13e6538360889e141e81ed299ee8e  $tmp/Twemoji.Mozilla.ttf" \
  | shasum -a 256 -c -
uvx --from 'fonttools[woff]==4.66.0' --with 'brotli==1.2.0' pyftsubset "$tmp/Twemoji.Mozilla.ttf" \
  --unicodes-file=crates/web/assets/emoji.txt --flavor=woff2 \
  --output-file=crates/web/assets/twemoji.woff2
"""

[tasks.check]
description = "The gate every change must pass"
depends = ["fmt", "lint", "deny", "dist", "test"]
