[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sanic-core = { path = "crates/core" }
sanic-github = { path = "crates/github" }
sanic-runner = { path = "crates/runner" }
sanic-store = { path = "crates/store" }
sanic-web = { path = "crates/web" }

clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
globset = "0.4"
notify = "8.2"
indexmap = { version = "2.14", features = ["serde"] }
insta = "1.48"
reqwest = { version = "0.13", features = ["json", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1", features = ["preserve_order"] }
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
