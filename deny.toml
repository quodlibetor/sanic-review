[graph]
all-features = true
# Platforms this runs on; skips e.g. Android/Windows-only crates.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
  # bincode is unmaintained, and its team calls 1.3.3 complete. syntect
  # uses it only to load the syntaxes and themes built into the binary,
  # never anything from outside, and has no release without it.
  { id = "RUSTSEC-2025-0141", reason = "syntect's own embedded dumps only" },
]

[licenses]
# The allowlist is policy, not an inventory of what the current graph uses.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Mozilla's root certificate data, via webpki-root-certs.
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unversioned by design.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
