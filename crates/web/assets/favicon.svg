<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A fast blue lump, drawn badly on purpose. The pale halo under the
       dark outline keeps it visible on a dark tab bar; each shape is
       drawn twice from one path, halo and outline, so they stay aligned. -->
  <defs>
    <path id="lines" d="M1 13h5M2 19h5M1 25h6"/>
    <path id="lump" d="M13 7 L6 4 L11 11 L4 12 L10 16 L4 21 L12 21
                       C12 27 18 30 23 29 C29 28 31 22 30 16 C29 9 24 5 18 6 Z"/>
  </defs>
  <!-- Shrunk so the halo fits inside the viewBox. -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(1.6 1.2) scale(0.92)">
    <!-- Both halos go under both outlines, and the lines under the lump,
         so the lines trail out from behind it. -->
    <use href="#lump" fill="none" stroke="#fff" stroke-width="5"/>
    <use href="#lines" fill="none" stroke="#fff" stroke-width="5"/>
    <use href="#lines" fill="none" stroke="#14142b" stroke-width="2.4"/>
    <use href="#lump" fill="#2f6cf0" stroke="#14142b" stroke-width="2.2"/>
    <ellipse cx="20" cy="14" rx="3.4" ry="4.4" fill="#fff" stroke="#14142b" stroke-width="1.6"/>
    <ellipse cx="26.2" cy="15" rx="2.6" ry="3.4" fill="#fff" stroke="#14142b" stroke-width="1.6"/>
    <circle cx="21.4" cy="15.4" r="1.7" fill="#14142b"/>
    <circle cx="26.6" cy="14.2" r="1.4" fill="#14142b"/>
    <path d="M20 23 Q24 25 27 21" fill="none" stroke="#14142b" stroke-width="1.8"/>
  </g>
</svg>
